services:
  finbot:
    build: .
    image: finbot:research-20261022
    pull_policy: never
    restart: unless-stopped
    init: true
    stop_grace_period: 120s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - path: .env.config
        required: true
        format: raw
    environment:
      FINBOT_DB_PATH: /data/finbot.db
      FINBOT_SKIP_INSTALL: "true"
      STREAMLIT_PORT: "8501"
      ENABLE_HTTPS: "true"
      FINBOT_TLS_CERT_DIR: /data/certs
      FINBOT_ENV_CONFIG_PATH: /data/runtime.env
      FINBOT_LOG_TO_STDOUT: "true"
      # Keep one writable replica. Optional S3 settings come from env_file or
      # the hosting provider's injected environment and never mount S3 at /data.
    ports:
      - "${FINBOT_HOST_PORT:-8501}:8501"
    volumes:
      - finbot_data:/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "/app/healthcheck.py"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3

volumes:
  finbot_data:
    external: true
    name: finbot_migrated_20261022
